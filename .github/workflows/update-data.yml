name: Update experience data

# Corre solo cuando el push toca public/data/ (dar de alta o editar un
# trabajo/colaboración en experience.json) — sube nada más esa carpeta por
# FTPS, sin instalar dependencias ni rehacer el build de la app. Tarda
# segundos en vez de los ~3 minutos del deploy completo (deploy.yml).
#
# También se puede lanzar a mano desde la pestaña Actions de GitHub
# ("Run workflow") si alguna vez hace falta re-sincronizar sin un push nuevo.
on:
  push:
    branches: [main]
    paths:
      - "public/data/**"
  workflow_dispatch: {}

jobs:
  sync-data:
    name: Sync public/data/ to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload public/data/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/data/
          # Mismo destino donde vive dist/data/ tras un deploy completo (ver
          # deploy.yml) — Vite copia public/ a la raíz de dist/ tal cual.
          server-dir: ./data/
          exclude: |
            **/.git*
            **/.git*/**
