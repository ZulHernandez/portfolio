name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30's undici dependency necesita el webidl cache que Node
          # incorporó en 22.10+ (en Node 20 falla con "webidl.util.
          # markAsUncloneable is not a function" al correr los tests).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Run tests
        run: npm test -- --run

      - name: Rebuild CSS from Sass partials
        run: npm run build:css

      - name: Build
        run: npm run build
